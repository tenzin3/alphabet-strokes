<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tibetan Alphabet Stroke Guide</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Step-by-step handwriting</p>
      <h1>First Four Tibetan Alphabets</h1>
      <p class="sub">Follow the dotted path, stroke numbers, and animated red brush to learn ཀ ཁ ག ང.</p>
    </div>
    <button id="themeToggle" aria-label="Toggle theme">☾</button>
  </header>

  <main>
    <section class="letter-picker" id="letterPicker"></section>

    <section class="workspace">
      <article class="card guide-card">
        <div class="guide-head">
          <div>
            <p class="eyebrow">Current letter</p>
            <h2 id="letterTitle"></h2>
          </div>
          <div class="controls">
            <button id="prevStep">Back</button>
            <button id="playStep" class="primary">Play stroke</button>
            <button id="nextStep">Next</button>
          </div>
        </div>
        <div class="svg-wrap">
          <svg id="strokeSvg" viewBox="0 0 500 500" role="img" aria-label="Tibetan stroke guide"></svg>
        </div>
        <div class="progress"><span id="progressBar"></span></div>
        <p id="instruction" class="instruction"></p>
      </article>

      <article class="card practice-card">
        <div class="guide-head">
          <div>
            <p class="eyebrow">Practice</p>
            <h2>Trace it yourself</h2>
          </div>
          <button id="clearCanvas">Clear</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="practiceCanvas" width="500" height="500"></canvas>
        </div>
        <p class="hint">Use mouse, trackpad, or finger. The faint guide remains underneath.</p>
      </article>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
